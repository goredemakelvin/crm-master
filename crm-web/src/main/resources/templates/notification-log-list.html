<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <a th:href="@{/communication-management}"><i class="material-icons" style="font-size:24px;color:red">arrow_back</i></a>
    <h4>Notification Logs Page</h4>
<!--    <p><a href="#" class="link-underline-primary" th:href="@{/city-form}">Add City</a></p>-->
    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>Subject</th>
            <th>Message</th>
            <th>Date Created</th>
            <th>Recipient</th>
            <th>Sent</th>
            <th>Delivered</th>
            <th>Channel</th>
        </tr>
        </thead>
        <tbody>

        <tbody>
        <tr th:if="${notificationLogPage != null}"  th:each="log : ${notificationLogPage.content}">
<!--            <td><a th:text="${city.id}" th:href="@{/city/{id}(id=${city.id})}"></a></td>-->
            <td th:text="${log.promotionMessage.subject}"></td>
            <td th:text="${log.promotionMessage.text}"></td>
            <td th:text="${log.promotionMessage.createdDate}"></td>
            <td th:text="${log.lead.customer.firstName}"></td>
            <td th:text="${log.sent}"></td>
            <td th:text="${log.delivered}"></td>
            <td th:text="${log.channel}"></td>
<!--            <td th:text="${account.accountNumber}"></td>-->
        </tr>
        </tbody>
    </table>

    <ul class="pagination">
        <li class="page-item">
            <a class="page-link" th:if="${currentPage > 0}"
               th:href="@{/notification-log-list(page=0, size=${notificationLogPage.size})}">First</a></li>
        <li class="page-item">
            <a class="page-link" th:if="${currentPage > 0}"
               th:href="@{/notification-log-list(page=${currentPage - 1}, size=${notificationLogPage.size})}">Previous</a>

        </li>
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
           <li class="page-item">
            <a class="page-link" th:href="@{/notification-log-list(page=${i}, size=${notificationLogPage.size})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''"></a>
           </li>
        </span>

        <li class="page-item"><a class="page-link" th:if="${currentPage < totalPages - 1}"
                                 th:href="@{/notification-log-list(page=${currentPage + 1}, size=${notificationLogPage.size})}">Next</a>
        </li>
        <li class="page-item"><a class="page-link" th:if="${currentPage < totalPages - 1}"
                                 th:href="@{/notification-log-list(page=${totalPages - 1}, size=${notificationLogPage.size})}">Last</a>
        </li>
    </ul>
</div>


<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>

</body>
</html>
