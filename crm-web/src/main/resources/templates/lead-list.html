<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <h2>Leads Page</h2>
    <p>This page shows current leads captured by the system</p>
    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone Number</th>
            <th>Company Name</th>
            <th>Job Title</th>
            <th>City</th>
            <th>Country</th>
            <th>Lead Source</th>
            <th>Preferred Contact Method</th>
        </tr>
        </thead>
        <tbody>

        <tbody>
    <tr th:each="lead : ${leadsPage.content}">
        <td><a th:text="${lead.id}" th:href="@{/lead/{id}(id=${lead.id})}"></a></td>
        <td th:text="${lead.fullName}"></td>
        <td th:text="${lead.emailAddress}"></td>
        <td th:text="${lead.phoneNumber}"></td>
        <td th:text="${lead.company}"></td>
        <td th:text="${lead.jobTitle}"></td>
        <td th:text="${lead.city}"></td>
        <td th:text="${lead.country}"></td>
        <td th:text="${lead.leadSource}"></td>
        <td th:text="${lead.preferedContact}"></td>
    </tr>
        </tbody>
    </table>

    <ul class="pagination">
        <li class="page-item">
            <a class="page-link" th:if="${currentPage > 0}"
               th:href="@{/lead-list(page=0, size=${leadsPage.size})}">First</a></li>
        <li class="page-item">
            <a class="page-link" th:if="${currentPage > 0}"
               th:href="@{/lead-list(page=${currentPage - 1}, size=${leadsPage.size})}">Previous</a>

        </li>
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
           <li class="page-item">
            <a class="page-link" th:href="@{/lead-list(page=${i}, size=${leadsPage.size})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''"></a>
           </li>
        </span>

        <li class="page-item"><a class="page-link" th:if="${currentPage < totalPages - 1}"
                                 th:href="@{/lead-list(page=${currentPage + 1}, size=${customerPage.size})}">Next</a>
        </li>
        <li class="page-item"><a class="page-link" th:if="${currentPage < totalPages - 1}"
                                 th:href="@{/lead-list(page=${totalPages - 1}, size=${customerPage.size})}">Last</a>
        </li>
    </ul>
</div>


<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>

</body>
</html>
