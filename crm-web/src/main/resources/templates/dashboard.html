<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->
<body>
<div class="container mt-3">
    <div class="row">
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Leads</h4>
                    <p class="card-text"><span th:text="${leadsCount}"></span></p>
                    <a th:href="@{/lead-list}" class="btn btn-success">See more</a>
                </div>
                </div>
            </div>
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Customers</h4>
                    <p class="card-text"><span th:text="${customersCount}"></span></p>
                    <a th:href="@{/customer-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Contacts</h4>
                    <p class="card-text"><span th:text="${contactCount}"></span></p>
                    <a th:href="@{/contact-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Accounts</h4>
                    <p class="card-text"><span th:text="${accountCount}"></span></p>
                    <a th:href="@{/account-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
    </div>
    <br>
    <div class="row">
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Cities</h4>
                    <p class="card-text"><span th:text="${cityCount}"></span></p>
                    <a th:href="@{/city-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Countries</h4>
                    <p class="card-text"><span th:text="${countryCount}"></span></p>
                    <a th:href="@{/country-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Business</h4>
                    <p class="card-text"><span th:text="${businessInfoCount}"></span></p>
                    <a th:href="@{/business-info-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Opportunity</h4>
                    <p class="card-text"><span th:text="${opportunityCount}"></span></p>
                    <a th:href="@{/opportunity-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
    </div>
    <br/>
    <div class="row">
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Contact Person</h4>
                    <p class="card-text"><span th:text="${contactCount}"></span></p>
                    <a th:href="@{/contact-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Notifications</h4>
                    <p class="card-text"><span th:text="${notificationCount}"></span></p>
                    <a th:href="@{/notification-log-list}" class="btn btn-success">See More</a>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
        </div>
    </div>
</div>
</body>
</html>
