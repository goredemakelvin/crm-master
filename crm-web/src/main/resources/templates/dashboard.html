<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet"/>
    <script th:src="@{/assets/js/script.js}"></script>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>

<body>
<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <div class="row">
        <div class="col-sm-3">
            <div class="card bg-success text-white fs-6">
                <div class="card-body">Leads <span th:text="${leadsCount}"></span></div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-success text-white fs-6">
                <div class="card-body">Total Customers <span th:text="${customersCount}"></span></div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-success text-white fs-6">
                <div class="card-body">Total Contacts</div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-success text-white fs-6">
                <div class="card-body">Total Accounts</div>
            </div>
        </div>
    </div>
    <hr/>
    <div class="row">
        <div class="col-sm-3">
            <div class="card bg-warning text-white fs-6">
                <div class="card-body">Cities <span th:text="${leadsCount}"></span></div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-warning text-white fs-6">
                <div class="card-body">Countries <span th:text="${customersCount}"></span></div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-warning text-white fs-6">
                <div class="card-body">Industries</div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-warning text-white fs-6">
                <div class="card-body">Contact Persons</div>
            </div>
        </div>
    </div>
    <hr/>
    <div class="row">
        <div class="col-sm-3">
            <div class="card bg-primary-subtle text-white fs-6">
                <div class="card-body">Opportunities <span th:text="${leadsCount}"></span></div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-primary-subtle text-white fs-6">
                <div class="card-body">Emails Sent<span th:text="${customersCount}"></span></div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-primary-subtle text-white fs-6">
                <div class="card-body">Sms Sent</div>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="card bg-primary-subtle text-white fs-6">
                <div class="card-body">Pending Messages</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
