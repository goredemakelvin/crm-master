<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" th:href="@{/assets/css/login.css}"/>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="row">
        <div class="col-8">
            <div class="mb-3 mt-3" th:if="${param.error}" style="color: red;">
                Invalid username or password.
            </div>
            <div class="mb-3 mt-3" th:if="${param.logout}" style="color: green;">
                You have been logged out.
            </div>
            <h2>CRM Login</h2>
            <form th:action="@{/login}" method="post">
                <div  class="mb-2">
                    <label for="username">Username:</label>
                    <input  type="text" class="form-control col-6" placeholder="Enter email" name="username">
                </div>
                <div class="mb-3">
                    <label for="password">Password:</label>
                    <input type="password" class="form-control" placeholder="Enter password" name="password">
                </div>
                <div class="form-check mb-3">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="remember"> Remember me
                    </label>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <div class="form-check mb-3">
                <label for="create-account">Not registered?
                    <a th:href="@{/register}">Create an account</a></label>
            </div>
        </div>
    </div>
</div>
</body>

</html>
