<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <h2>Industry Form</h2>
    <form th:action="@{/save-industry}" th:object="${industry}" method="POST">
            <input th:field="*{id}" type="hidden" class="form-control" id="id" name="id" readonly="readonly">

        <div class="mb-3 mt-3">
            <label for="name">Name:</label>
            <input th:field="*{name}" type="text" class="form-control" id="name" name="name">
        </div>
        <button type="button" class="btn btn-danger">Cancel</button>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>
<!-- /page container -->

</body>
</html>
