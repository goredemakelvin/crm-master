<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

</head>

<body>
<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <a th:href="@{/admin}"><i class="material-icons" style="font-size:24px;color:red">arrow_back</i></a>
    <h3>Cities Page</h3>
    <nav class="nav ">
        <a class="nav-link" th:href="@{/city-form}">City Form</a>
    </nav>
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
        </tr>
        </thead>
        <tbody>

        <tbody>
        <tr th:if="${cityPage != null}"  th:each="city : ${cityPage.content}">
            <td><a th:text="${city.id}" th:href="@{/city/{id}(id=${city.id})}"></a></td>
            <td th:text="${city.name}"></td>
        </tr>
        </tbody>
    </table>

    <ul class="pagination flex-wrap">
        <li class="page-item">
            <a class="page-link" th:if="${currentPage > 0}"
               th:href="@{/city-list(page=0, size=${cityPage.size})}">First</a></li>
        <li class="page-item">
            <a class="page-link" th:if="${currentPage > 0}"
               th:href="@{/city-list(page=${currentPage - 1}, size=${cityPage.size})}">Previous</a>

        </li>
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
           <li class="page-item">
            <a class="page-link" th:href="@{/city-list(page=${i}, size=${cityPage.size})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''"></a>
           </li>
        </span>

        <li class="page-item"><a class="page-link" th:if="${currentPage < totalPages - 1}"
                                 th:href="@{/city-list(page=${currentPage + 1}, size=${cityPage.size})}">Next</a>
        </li>
        <li class="page-item"><a class="page-link" th:if="${currentPage < totalPages - 1}"
                                 th:href="@{/city-list(page=${totalPages - 1}, size=${cityPage.size})}">Last</a>
        </li>
    </ul>
</div>


<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>

</body>
</html>
