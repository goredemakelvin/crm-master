<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <a th:href="@{/admin}"><i class="material-icons" style="font-size:24px;color:red">arrow_back</i></a>
    <h4>Contact Person</h4>
    <form th:action="@{/save-contact}" th:object="${contact}" method="POST">
        <input th:field="*{id}" type="hidden" class="form-control" id="id" name="id" readonly="readonly">
        <div class="mb-3 mt-3">
            <label for="firstName">First Name:</label>
            <input th:field="*{firstName}" type="text" class="form-control" id="firstName" name="firstName">
            <span class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>
        <div class="mb-3 mt-3">
            <label for="lastName">Last Name:</label>
            <input th:field="*{lastName}" type="text" class="form-control" id="lastName" name="lastName">
        </div>
        <div class="mb-3 mt-3">
            <label for="emailAddress">Email Address</label>
            <input th:field="*{emailAddress}" type="email" class="form-control" id="emailAddress" name="emailAddress">
        </div>

        <div class="mb-3 mt-3">
            <label for="phoneNumber">Phone Number</label>
            <input th:field="*{phoneNumber}" type="text" class="form-control" id="phoneNumber" name="phoneNumber">
        </div>

<!--        <button type="button" class="btn btn-danger">Cancel</button>-->
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>
<!-- /page container -->

</body>
</html>
