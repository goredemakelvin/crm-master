<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->
    <div class="container mt-5">
        <h2 class="mb-4">Admin - Manage User Roles</h2>

        <table class="table table-bordered table-striped">
            <thead class="table-primary">
            <tr>
                <th>Username</th>
                <th>Roles</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <form th:action="@{'/admin/users/' + ${user.id} + '/update-roles'}" method="post">
                    <td th:text="${user.username}">Username</td>
                    <td>
                        <div th:each="role : ${availableRoles}" class="form-check form-check-inline">
                            <input type="checkbox" class="form-check-input"
                                   th:id="${user.id + '_' + role}"
                                   th:name="roles"
                                   th:value="${role}"
                                   th:checked="${user.roles.contains(role)}"/>
                            <label class="form-check-label" th:for="${user.id + '_' + role}" th:text="${role}"></label>
                        </div>
                    </td>
                    <td><button class="btn btn-sm btn-primary">Update</button></td>
                </form>
            </tr>
            </tbody>
        </table>
    </div>
<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>
<!-- /page container -->

</body>
</html>
