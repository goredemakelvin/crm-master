<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="header">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"/>
    <!-- jQuery (required by Toastr) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Toastr JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
<div >
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand"  th:href="@{/}">
                <img th:src="@{/assets/images/logo.png}" alt="Logo" style="width:30px;" class="rounded-pill">
            </a>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link"  th:href="@{/sales-management}">Sales And Orders</a>
                </li>
                <li class="nav-item">
                    <a  th:href="@{/business-management}"   class="nav-link" href="#">Business Information</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/communication-management}">Marketing and Communication</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Customer Support and Services </a>
                </li>

                <li class="nav-item">
                    <a th:href="@{/admin}" class="nav-link" href="#">Admin</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/lead-management}" class="nav-link" href="#">Lead Management</a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/customer-management}" class="nav-link" href="#">Customer Management</a>
                </li>
            </ul>
        </div>
            <a th:href="@{/logout}" class="btn btn-info btn-sm">
                <i class="bi bi-box-arrow-right"></i> Log out
            </a>
        </div>
    </nav>
    <div class="container mt-3">
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <span th:text="${successMessage}">Success!</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div id="errorToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <span th:text="${errorMessage}">Success!</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
