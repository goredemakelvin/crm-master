<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body th:fragment="basic-info">
<table class="table">
    <thead class="table-light">
    <tr>
        <th>Phone Numbers</th>
        <th>Email Addresses</th>
        <th>Customer Number</th>
        <th>Subcription Date</th>
        <th>Website</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${customerInformation != null}">
        <td><span th:text="${customerInformation.phoneNumbers}"></span></td>
        <td><span th:text="${customerInformation.emailAddresses}"></span></td>
        <td><span th:text="${customerInformation.customerNumber}"></span></td>
        <td><span th:text="${customerInformation.subscriptionDate}"></span></td>
        <td><span th:text="${customerInformation.website}"></span></td>

    </tr>
    </tbody>
</table>

</body>
</html>
