<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <h2>Accounts Page</h2>
<!--    <p><a href="#" class="link-underline-primary" th:href="@{/city-form}">Add City</a></p>-->
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>Account Name</th>
            <th>AccountNumber</th>
        </tr>
        </thead>
        <tbody>

        <tbody>
        <tr th:if="${accountPage != null}"  th:each="account : ${accountPage.content}">
<!--            <td><a th:text="${city.id}" th:href="@{/city/{id}(id=${city.id})}"></a></td>-->
            <td th:text="${account.name}"></td>
            <td th:text="${account.accountNumber}"></td>
        </tr>
        </tbody>
    </table>

    <ul class="pagination">
        <li class="page-item">
            <a class="page-link" th:if="${currentPage > 0}"
               th:href="@{/account-list(page=0, size=${accountPage.size})}">First</a></li>
        <li class="page-item">
            <a class="page-link" th:if="${currentPage > 0}"
               th:href="@{/account-list(page=${currentPage - 1}, size=${accountPage.size})}">Previous</a>

        </li>
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
           <li class="page-item">
            <a class="page-link" th:href="@{/account-list(page=${i}, size=${accountPage.size})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''"></a>
           </li>
        </span>

        <li class="page-item"><a class="page-link" th:if="${currentPage < totalPages - 1}"
                                 th:href="@{/account-list(page=${currentPage + 1}, size=${accountPage.size})}">Next</a>
        </li>
        <li class="page-item"><a class="page-link" th:if="${currentPage < totalPages - 1}"
                                 th:href="@{/account-list(page=${totalPages - 1}, size=${accountPage.size})}">Last</a>
        </li>
    </ul>
</div>


<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>

</body>
</html>
