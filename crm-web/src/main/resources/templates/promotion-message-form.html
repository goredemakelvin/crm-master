<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <h2>Promotion Message Form</h2>
    <form th:action="@{/save-promotion-message}" th:object="${promotionMessage}" method="POST">
            <input th:field="*{id}" type="hidden" class="form-control" id="id" name="id" readonly="readonly">

        <div class="mb-3 mt-3">
            <label for="leadSegment">Lead Segment</label>

            <select th:field="*{leadSegment}" class="form-select" aria-label="-- Select an Option --">
                <option value="">-- Select an Option --
                </option>
                <option
                        th:each="item : ${leadSegments}"
                        th:value="${item.id}"
                        th:text="${item.name}"
                ></option>
            </select>
        </div>

        <div class="mb-3 mt-3">
            <label for="text">Name:</label>
            <textarea rows = "20" cols = "80" th:field="*{text}" class="form-control" id="text"></textarea>
        </div>


        <button type="button" class="btn btn-danger">Cancel</button>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>
<!-- /page container -->

</body>
</html>
