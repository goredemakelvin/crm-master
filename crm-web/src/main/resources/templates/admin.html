<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Web Portal</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<!-- Main navbar -->
<div th:replace="/fragments/header :: header"></div>
<!-- /main navbar -->

<div class="container mt-3">
    <h2>Admin Page</h2>
    <p>This page is designed for configurations</p>
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>City</th>
            <th>Country</th>
            <th>Industry</th>
            <th>Contact Persons</th>
            <th>Lead Segments</th>
            <th>Promotion Messages</th>
            <th>User Roles</th>
        </tr>
        </thead>
        <tbody>

        <tbody>
        <tr >
            <td><a th:href="@{/city-list}">Cities</a></td>
            <td><a th:href="@{/country-list}">Countries</a></td>
            <td><a th:href="@{/industry-list}">Industries</a></td>
            <td><a th:href="@{/contact-list}">Contact Persons</a></td>
            <td><a th:href="@{/lead-segment-list}">Lead Segments</a></td>
            <td><a th:href="@{/promotion-message-list}">Promotion Message</a></td>
            <td><a th:href="@{/admin/users}">User Roles</a></td>
        </tr>
        </tr>
        </tbody>
    </table>
</div>


<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>
<!-- /footer -->

</div>

</body>
</html>
