<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Template</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0;">
<table cellpadding="0" cellspacing="0" style="padding: 20px;" width="100%">
    <tr>
        <td align="center">
            <table cellpadding="0" cellspacing="0" style="background-color: #ffffff; padding: 30px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);"
                   width="600">
                <tr>
                    <td align="center" style="padding-bottom: 20px;">
                        <h2 style="color: #333333; margin: 0;">Welcome to Our Service</h2>
                    </td>
                </tr>
                <tr>
                    <td style="color: #555555; font-size: 16px; line-height: 1.6;">
                        <p>Hi <span th:text="${name}"></span></p>
                        <p  th:text="${content}"></p>
                        <p>To get started, click the button below:</p>
                        <p style="text-align: center;">
                            <a th:href="${websiteUrl}"
                               style="background-color: #007bff; color: #ffffff; text-decoration: none; padding: 10px 20px; border-radius: 4px; display: inline-block;">Get
                                Started</a>
                        </p>
                        <p>If you have any questions, feel free to contact us.</p>
                        <p>Best regards,<br>The Team</p>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding-top: 30px; font-size: 12px; color: #888888;">
                        <p>© 2025 Cicosy</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
